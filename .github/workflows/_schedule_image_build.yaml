name: Build Selected Test Image

on:
  workflow_call:
    inputs:
      device:
        description: 'Ascend device Dockerfile variant'
        required: true
        type: string
      os:
        description: 'Base operating system'
        required: true
        type: string
      image_tag:
        description: 'Image tag prefix'
        required: true
        type: string
      source_ref:
        description: 'Branch or ref of vllm-ascend-kimi-k3 to build'
        required: true
        type: string
      quay_username:
        description: 'Quay username for pushing the image'
        required: true
        type: string
    secrets:
      QUAY_TOKEN:
        description: 'Quay token for pushing the image'
        required: true

env:
  IMAGE_REPO: quay.io/atlas-ci/vllm-atlas-day0

jobs:
  build-push-digest:
    name: Build ${{ matrix.arch_tag }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_tag: amd64
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            arch_tag: arm64

    steps:
      - name: Checkout vllm-ascend-kimi-k3
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_ref }}

      - name: Resolve and validate Dockerfile
        id: dockerfile
        shell: bash
        env:
          DEVICE: ${{ inputs.device }}
          BASE_OS: ${{ inputs.os }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          case "$DEVICE" in
            a2) dockerfile="Dockerfile" ;;
            a3|a5|310p) dockerfile="Dockerfile.${DEVICE}" ;;
            *) echo "Unsupported device: $DEVICE" >&2; exit 1 ;;
          esac

          case "$BASE_OS" in
            ubuntu) ;;
            openeuler) dockerfile="${dockerfile}.openEuler" ;;
            *) echo "Unsupported operating system: $BASE_OS" >&2; exit 1 ;;
          esac

          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,63}$ ]]; then
            echo "Invalid image tag prefix: $IMAGE_TAG" >&2
            exit 1
          fi
          if [[ ! -f "$dockerfile" ]]; then
            echo "Dockerfile does not exist: $dockerfile" >&2
            exit 1
          fi

          echo "path=$dockerfile" >> "$GITHUB_OUTPUT"
          echo "Selected Dockerfile: $dockerfile"

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          docker-images: false

      - name: Login to private Quay repository
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ inputs.quay_username }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true
          driver: docker-container
          use: true

      - name: Build and push architecture digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.IMAGE_REPO }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
            COMPILE_CUSTOM_KERNELS=1
          provenance: false

      - name: Add temporary tag to protect digest from garbage collection
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DEVICE: ${{ inputs.device }}
          BASE_OS: ${{ inputs.os }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ARCH_TAG: ${{ matrix.arch_tag }}
        run: |
          set -euo pipefail
          temp_tag="${IMAGE_TAG}-${DEVICE}-${BASE_OS}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH_TAG}-temp"
          docker buildx imagetools create \
            -t "${IMAGE_REPO}:${temp_tag}" \
            "${IMAGE_REPO}@${DIGEST}"

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ inputs.device }}-${{ inputs.os }}-${{ matrix.arch_tag }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-image:
    name: Push multi-architecture image
    runs-on: ubuntu-latest
    needs: build-push-digest

    steps:
      - name: Download architecture digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.device }}-${{ inputs.os }}-*
          merge-multiple: true

      - name: Login to private Quay repository
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ inputs.quay_username }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Merge and push multi-architecture manifest
        shell: bash
        env:
          DEVICE: ${{ inputs.device }}
          BASE_OS: ${{ inputs.os }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail

          mapfile -t digests < <(find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f -printf '%f\n')
          if (( ${#digests[@]} != 2 )); then
            echo "Expected 2 architecture digests, found ${#digests[@]}" >&2
            exit 1
          fi

          digest_refs=()
          for digest in "${digests[@]}"; do
            digest_refs+=("${IMAGE_REPO}@sha256:${digest}")
          done

          final_image="${IMAGE_REPO}:${IMAGE_TAG}-${DEVICE}-${BASE_OS}"
          docker buildx imagetools create \
            -t "$final_image" \
            "${digest_refs[@]}"
          echo "Published $final_image"
          {
            echo "### Published image"
            echo "\`$final_image\`"
            echo ""
            echo "Source branch: \`$SOURCE_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"
